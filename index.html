  <!-- Structured Data: FAQ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Are these physically shipped books?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No, CILI materials are digital PDF workbooks. This allows for instant delivery so you can start studying immediately after checkout. You can print them or use them on any device."
        }
      },
      {
        "@type": "Question",
        "name": "Can I print the materials?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes! All our PDFs are high-resolution and professionally formatted for standard A4 and US Letter printing. They look great both on screen and on paper."
        }
      },
      {
        "@type": "Question",
        "name": "What's the difference between Standard and Extended?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Standard packs include 2 example sentences per vocabulary word. Extended packs provide deep immersion with 4 unique example sentences per word, giving you double the context."
        }
      },
      {
        "@type": "Question",
        "name": "How do I receive my download?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "After a secure checkout via Gumroad, you'll receive an instant download link on the confirmation page. You'll also get an email with a permanent link to your library."
        }
      },
      {
        "@type": "Question",
        "name": "What HSK levels do you cover?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We cover all six HSK levels (HSK 1 through HSK 6), totaling over 5,000 vocabulary words. Each level is available individually or as value bundles (HSK 1-3, HSK 4-6, and the complete HSK 1-6 pack)."
        }
      },
      {
        "@type": "Question",
        "name": "How many words and sentences are included in each HSK level?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "HSK 1: 150 words (300-600 sentences). HSK 2: 150 words (300-600 sentences). HSK 3: 300 words (600-1,200 sentences). HSK 4: 600 words (1,200-2,400 sentences). HSK 5: 1,300 words (2,600-5,200 sentences). HSK 6: 2,500 words (5,000-10,000 sentences). The range depends on whether you choose Standard (2 sentences per word) or Extended (4 sentences per word)."
        }
      },
      {
        "@type": "Question",
        "name": "Can I use these PDFs with Anki or other flashcard apps?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Our PDFs are optimized for reading and printing. While they are not directly importable into Anki, the structured format (word, Pinyin, translation, example sentences) makes it easy to create your own flashcards from the content."
        }
      },
      {
        "@type": "Question",
        "name": "Are the Chinese characters simplified or traditional?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "All CILI materials use simplified Chinese characters, which is the standard for HSK exams and is used in mainland China. Each word includes Pinyin romanization and English translations for easy learning."
        }
      }
    ]
  }
